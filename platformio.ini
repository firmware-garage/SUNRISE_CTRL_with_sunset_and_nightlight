; Sunrise Light v3 - ESP8266 + WS2815 (144 px), sunrise, sunset and night light
; USB env for the first flash, OTA env for every update after that.
;
; The OTA password lives in secrets.ini (gitignored). Copy secrets.ini.example
; to secrets.ini and set it there. It feeds both the firmware (OTA_PASSWORD,
; also the /update page and RESET WIFI password) and espota's --auth, so the
; two can't drift apart. Without secrets.ini the build falls back to
; "changeme" and prints a warning.

[platformio]
extra_configs = secrets.ini

[secrets]
ota_password = changeme

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
  makuna/NeoPixelBus @ ^2.8.0
  tzapu/WiFiManager @ ^2.0.17
build_flags = '-DOTA_PASSWORD="${secrets.ota_password}"'
extra_scripts = pre:scripts/check_secrets.py

[env:nodemcuv2_ota]
extends = env:nodemcuv2
upload_protocol = espota
upload_port = sunrise.local   ; or the IP shown at the bottom of the page
upload_flags = --auth=${secrets.ota_password}
